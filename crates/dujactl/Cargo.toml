[package]
name = "dujactl"
description = "Command-line companion for Duja: scriptable control of the running app over local IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "dujactl"
path = "src/main.rs"

[dependencies]
duja-core.workspace = true
duja-ipc.workspace = true
duja-platform.workspace = true
duja-ddc.workspace = true
duja-panel.workspace = true

# `doctor`'s Linux section reports whether software dimming is available and why
# (ADR-0011). Linux-only, because the probe it calls is: on the other two
# platforms `doctor` has nothing of the kind to say, and pulling the dimmer into
# the CLI everywhere would add a dependency for one target's diagnostic.
[target.'cfg(target_os = "linux")'.dependencies]
duja-dimmer.workspace = true

[lints]
workspace = true
