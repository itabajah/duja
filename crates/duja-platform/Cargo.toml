[package]
name = "duja-platform"
description = "OS integration for Duja: hot-plug & power events, single-instance, autostart, IPC, screen geometry."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
duja-core.workspace = true
# The named-pipe transport (P5) speaks the duja-ipc protocol over a raw byte
# stream, so the platform crate owns the confined Win32 `unsafe` while duja-ipc
# stays `#![forbid(unsafe_code)]` pure protocol.
duja-ipc.workspace = true
thiserror = { workspace = true }
crossbeam-channel = { workspace = true }

[features]
# Exposes the in-memory `FakeAutostart` (and other seams) to downstream crates'
# tests, mirroring duja-core's `test-support` convention. Never in a release.
test-support = []

[target.'cfg(windows)'.dependencies]
# Windows event pump: hidden top-level window + display/power/session
# notifications (P3). default-features off; enable only the modules we touch.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # Tray-flyout geometry: the monitor scale under the cursor (GetDpiForMonitor),
    # queried before the window is shown so it can be placed in one pass.
    "Win32_UI_HiDpi",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
    "Win32_Devices_Display",
    # Single-instance guard: a named mutex plus the token/SID lookup that
    # disambiguates the mutex name per user.
    "Win32_System_Threading",
    "Win32_Security",
    # Autostart: HKCU ...\CurrentVersion\Run value read/write/delete (P5).
    # Also the `desktop` module's AppsUseLightTheme dark-mode read.
    "Win32_System_Registry",
    # `desktop::open_url`: ShellExecuteW's "open" verb (the default browser).
    "Win32_UI_Shell",
    # IPC named-pipe transport (P5): pipe create/connect/peek, file read/write,
    # the explicit DACL (SDDL → security descriptor), and the client PID/session
    # check.
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
] }

# -- Unix backends (macOS today, Linux at P7) -------------------------------
[target.'cfg(unix)'.dependencies]
# IPC unix-domain-socket transport (P6 macOS / P7 Linux): the sockets and
# permissions come from `std::os::unix`. `libc` covers two things std does not
# expose — the peer-credential seam (`getpeereid` / `SO_PEERCRED`), which is the
# only `unsafe` on this side, and the `open` flags and errno values `unix_dir`
# needs (`O_NOFOLLOW`, `O_DIRECTORY`, `ELOOP`, `ENOTDIR`), which it passes
# through safe `OpenOptions::custom_flags`.
libc = { workspace = true }
# The safe wrappers for the file-descriptor calls std has no equivalent of, which
# is what keeps all three of these modules free of `unsafe`: `flock` for the
# single-instance guard and the IPC bind lock, `fchmod` for `unix_dir`'s directory
# repair, and `geteuid`/`getuid` for the ownership checks and the `/tmp`
# runtime-dir fallback name.
rustix = { workspace = true }
# Resolves the macOS Application Support data dir (lock file) and the home dir
# (LaunchAgent plist).
directories = { workspace = true }

# -- macOS event pump + tray geometry ---------------------------------------
[target.'cfg(target_os = "macos")'.dependencies]
# CoreFoundation run-loop plumbing for the dedicated CFRunLoop thread. The
# CoreGraphics `CGDisplayRegisterReconfigurationCallback` and IOKit
# `IORegisterForSystemPower` externs are hand-declared in `mac/sys.rs` (no
# maintained safe binding covers them), each `unsafe` block carrying a SAFETY.
core-foundation-sys = { workspace = true }
# Tray-anchor geometry (`geometry::platform`): the global mouse location and each
# screen's frame / visibleFrame / backingScaleFactor. Same objc2 pins duja-dimmer
# already uses, so no new crate versions enter Cargo.lock.
objc2 = { workspace = true }
# Features are named per Objective-C class, and a leaf class feature pulls in its
# superclass features transitively.
objc2-app-kit = { workspace = true, features = [
    "std",
    # Unlocks the CGFloat-typed accessors (backingScaleFactor) — they are gated on
    # the core-foundation geometry types coming from this feature.
    "objc2-core-foundation",
    # NSScreen: screens(), frame, visibleFrame, backingScaleFactor.
    "NSScreen",
    # NSEvent: the class-level mouseLocation (Cocoa global points).
    "NSEvent",
    # `desktop`: NSWorkspace's openURL (default browser) and, through the
    # NSAccessibility category it also unlocks, accessibilityDisplayShouldReduceMotion.
    "NSWorkspace",
    "NSAccessibility",
] }
# NSPoint / NSRect (aliases of CGPoint / CGRect) as the FFI copies them out.
#
# Of the entries below, only `NSUserDefaults` is load-bearing. `NSGeometry`,
# `NSArray`, `objc2-core-foundation`, `NSString` and `NSURL` are all redundant
# *today* — measured one at a time, by deleting the line from THIS block and
# re-running `cargo check -p duja-platform --target aarch64-apple-darwin
# --all-features`, which still compiles in each case: objc2-app-kit's `NSScreen`
# and `NSWorkspace` features turn them on transitively and cargo unifies them in.
# (The `objc2-core-foundation` entry in the objc2-app-kit block above is a
# different feature and IS load-bearing, as are `NSWorkspace` and
# `NSAccessibility`.)
#
# They are declared anyway, and that is the deliberate choice, not a copy of
# another crate's list (duja-dimmer's objc2-foundation entry omits
# `objc2-core-foundation`): this crate names `NSPoint`/`NSRect`/`NSString`/`NSURL`
# and calls `NSArray::count`/`objectAtIndex` directly, so its own manifest should
# say so. Leaning on a sibling dependency's feature selection means dropping
# `NSScreen` from the list above — or an upstream narrowing its feature graph —
# turns into an unresolved-import error here with no hint about which manifest line
# was actually load-bearing.
#
# Named individually rather than as "the last two", which is how the previous
# version of this comment silently became false the moment the list grew.
objc2-foundation = { workspace = true, features = [
    "std",
    "NSGeometry",
    # NSArray's count/objectAtIndex, used to walk NSScreen::screens.
    "NSArray",
    "objc2-core-foundation",
    # `desktop`: NSString (both queries), NSURL (open_url), and NSUserDefaults
    # (the AppleInterfaceStyle dark-mode read).
    "NSString",
    "NSURL",
    "NSUserDefaults",
] }
# CGFloat, the return type of backingScaleFactor and the field type of NSRect.
objc2-core-foundation = { workspace = true, features = ["std", "CFCGTypes"] }

[dev-dependencies]
duja-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
