# Duja CI — the quality gate every PR merges through.
# All third-party actions are pinned by commit SHA (supply-chain policy).
# The toolchain is pinned by rust-toolchain.toml; rustup on the runners
# installs it (with rustfmt+clippy components) automatically on first use.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Slint system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # `fuzz/` is a separate workspace with its own `target/`, and the fuzz
          # check below is in a *required* job. Without this its whole dependency
          # tree recompiles on every run, which is a minute-scale cost added to a
          # check every PR waits on.
          workspaces: |
            .
            fuzz
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # `fuzz/` is a SEPARATE Cargo workspace (its own `[workspace]` table), so
      # `--workspace` above does not reach it and no other job compiles it. A
      # rename in `duja-core` therefore breaks a fuzz target silently, and the
      # only thing that would notice is the weekly burn in `fuzz.yml` - the
      # following Sunday, in a run nobody is watching, attributed to whatever
      # merged since.
      #
      # It lives here rather than in a job of its own for the same reason the
      # rustdoc step below does: a new job is a new status context, and a new
      # context is advisory until somebody edits branch protection. Folded into
      # an already-required check, it is enforced from the first PR.
      #
      # `cargo check`, not `cargo fuzz build`: running a fuzzer needs nightly for
      # SanitizerCoverage, but *compiling* the targets works on stable, and stale
      # API is the failure this is defending against.
      #
      # `--locked` because `fuzz/Cargo.lock` had drifted too - it still named
      # `duja-core 0.0.1` - and a lockfile nothing checks is the same rot one
      # directory down. No `--all-targets`: the package is six `[[bin]]`s with
      # `test`, `bench` and `doc` all false, so it selects exactly what plain
      # `cargo check` already does and only reads as though it broadened.
      - name: Check the fuzz workspace still compiles
        if: runner.os == 'Linux'
        run: cargo check --manifest-path fuzz/Cargo.toml --locked
      # rustdoc only sees what the target compiles, so the Linux-only `docs` job
      # below has never doc-checked a single `#[cfg(windows)]` or
      # `#[cfg(target_os = "macos")]` item — the whole Windows tray assembly and
      # all four macOS FFI backends, uncovered while `-D warnings` was enforced
      # on everything else.
      #
      # `--document-private-items` is load-bearing, not tidiness. rustdoc strips
      # private items *before* it resolves intra-doc links, and every macOS
      # backend is a private `mod mac;` — so without it this step would compile
      # the code, report success, and check almost none of it. (The Windows tray
      # would still be covered, but only by accident: Cargo passes the flag
      # automatically for *binary* targets, and the tray lives in duja-app's bin.)
      # Turning it on surfaced 15 genuinely broken doc links across both
      # platforms, all fixed in this PR. Keep it in sync with the `docs` job.
      #
      # This lives in the clippy matrix rather than in a `rustdoc (<os>)` matrix
      # of its own because `rustdoc` is a *required* status check matched by
      # exact name: turning that job into a matrix would rename the context and
      # leave every PR waiting forever on a check that can no longer report.
      # `clippy (<os>)` is already required. Linux is covered by `docs`.
      - name: rustdoc (non-Linux targets)
        if: runner.os != 'Linux'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps --all-features --document-private-items

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Slint system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-nextest
      # This is also the gate on the headless E2E smoke
      # (`duja-app/tests/e2e_smoke.rs`: fake backend → engine → IPC bridge →
      # real transport). It needs no job of its own — the matrix already covers
      # both IPC transports (Windows named pipe, unix domain socket) on the same
      # three OSes, and `--workspace --all-features` includes it. A separate
      # `e2e-smoke` job would be a strict subset of this one *and* would sit
      # outside branch protection's required checks, so it could go red while
      # the PR still merged.
      - run: cargo nextest run --workspace --all-features
      - run: cargo test --doc --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check

  msrv:
    name: msrv (core crates)
    runs-on: ubuntu-latest
    env:
      # Overrides rust-toolchain.toml for this job only.
      RUSTUP_TOOLCHAIN: "1.94"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # Scoped to the pure core crates. `duja-ui` is deliberately excluded: Slint
      # 1.17.1's own MSRV is 1.92 (≤ our 1.94 floor), so Slint itself is
      # compatible, but pinning the whole Slint dependency graph to a 1.94 check
      # buys little and would need the GUI system deps installed here too. The UI
      # crate's MSRV is covered transitively by the regular clippy/test jobs.
      - run: cargo check -p duja-core -p duja-ipc -p dujactl --all-features

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Slint system deps (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      # `--document-private-items` matters here for the same reason it does in
      # the clippy job's rustdoc step: without it rustdoc strips private items
      # before resolving intra-doc links, so private modules go unchecked. Keep
      # the two invocations in sync.
      - run: cargo doc --workspace --no-deps --all-features --document-private-items

  commit-lint:
    name: conventional commits
    runs-on: ubuntu-latest
    # Dependabot's commits are outside our control: it writes its own subjects
    # (grouped bumps can be long) and pastes upstream changelogs into the body.
    # Their PR titles are checked by the squash-merge convention instead.
    #
    # Not, as this comment said until now, because those bodies "can't obey our
    # line-length rules" - `committed.toml` sets `line_length = 0`, and committed
    # gates that check on the value being non-zero, so no body line is ever
    # measured. The rules that could actually fire here are the subject ones.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: crate-ci/committed@faeed42f2e10c244533a01525f13c4d8b6ce383f # v1.1.11
        with:
          args: -vv --no-merge-commit
