# Duja workspace — see docs/adr/ for architecture decisions.

[workspace]
resolver = "2"
members = [
    "crates/duja-core",
    "crates/duja-ddc",
    "crates/duja-panel",
    "crates/duja-dimmer",
    "crates/duja-platform",
    "crates/duja-ipc",
    "crates/duja-ui",
    "crates/duja-app",
    "crates/dujactl",
    "xtask",
]
# `fuzz/` is its own workspace (cargo-fuzz + libfuzzer-sys, nightly to run); keep
# it out of the main graph so its deps never touch the release lockfile.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.5"
edition = "2024"
# MSRV policy: "stable minus 2" (toolchain is 1.96.1), floor-bounded by Slint's
# MSRV once it lands. Verified by the `msrv` CI job.
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/itabajah/duja"
authors = ["Duja contributors"]
homepage = "https://github.com/itabajah/duja"

[workspace.dependencies]
# Inter-crate paths (single source of truth for internal deps).
duja-core = { path = "crates/duja-core" }
duja-ddc = { path = "crates/duja-ddc" }
duja-panel = { path = "crates/duja-panel" }
duja-dimmer = { path = "crates/duja-dimmer" }
duja-platform = { path = "crates/duja-platform" }
duja-ipc = { path = "crates/duja-ipc" }
duja-ui = { path = "crates/duja-ui" }
# External deps are added here (version-pinned once, referenced with
# `workspace = true`) at the phase where they are first used.
# Runtime: typed error enums per the error policy (§5). Runtime, no_std-free.
thiserror = "2"
# Runtime: lock-free MPMC channels for the std-thread actor model (ADR-0005).
crossbeam-channel = "0.5"
# Runtime (duja-platform, unix IPC transport, P6/P7): confined to the
# peer-credential seam (getpeereid / SO_PEERCRED) and euid/uid lookups; the
# sockets themselves are std::os::unix. Already in the graph transitively.
libc = "0.2"
# Runtime (config §7 + quirk DB): serde derive for the typed schemas;
# toml_edit (not `toml`) as the single shared TOML crate — its document model
# lets config round-trip unknown keys/comments, and its `serde` feature gives
# the quirk DB typed deserialisation; tempfile for same-dir atomic writes.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.25", features = ["serde"] }
tempfile = "3"
# Binaries only (§P3): ergonomic error bubbling in `main`. Library-style modules
# keep typed errors; only the thin binary wiring uses `anyhow`.
anyhow = "1"
# Dev-only: property-based testing for the pure-TDD kernel (continuum, EDID).
proptest = "1"
# Dev-only: snapshot testing for config migration fixtures (§4.1).
insta = { version = "1", features = ["toml"] }
# Windows DDC/CI backend (duja-ddc, P3): thin dxva2 + SetupAPI/registry EDID.
# Target-gated and feature-selected in the crate; default-features off keeps the
# dependency lean. Version matches the P1 spike (windows 0.62.x).
windows = { version = "0.62", default-features = false }
# macOS backend (duja-dimmer, P6): the objc2 ecosystem. objc2 core is 0.6.x; the
# framework crates (app-kit/foundation/core-graphics/core-foundation) are 0.3.x
# and pin objc2 0.6. dispatch2 (also objc2-family) marshals overlay ops onto the
# main queue. default-features off; each crate selects only the classes it needs
# (features are named per Objective-C class/header). Target-gated in the crate.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-core-foundation = { version = "0.3", default-features = false }
dispatch2 = { version = "0.3", default-features = false, features = ["std", "objc2"] }
# macOS DDC/CI backend (duja-ddc, P6): CoreGraphics display enumeration, IOKit
# service iteration, and CoreFoundation container types. This is the same thin,
# MIT/Apache-2.0 slice the `ddc-macos` crate is built on (ADR-0013); the private
# IOAVService/CoreDisplay symbols are resolved at runtime via dlsym (mac::sys),
# not through any crate. Target-gated so no non-macOS build ever sees them.
core-foundation = "0.10"
core-foundation-sys = "0.8"
core-graphics = "0.25"
io-kit-sys = "0.5"
# UI (duja-ui, P4): Slint with the software renderer (ADR-0009 — 9.76 MB binary,
# ~17 MB idle RSS). Feature set + version pinned to the P1 `spike/eventloop`
# recipe: default-features off, then the winit backend, std, compat, and the
# software renderer. `slint-build` compiles the `.slint` markup in build.rs.
slint = { version = "1.17.1", default-features = false, features = ["compat-1-2", "backend-winit", "std", "renderer-software"] }
slint-build = "1.17.1"
# The winit backend crate, used directly for two things the `slint` facade does
# not expose: the raw `WindowEvent` filter (`on_winit_window_event`) that hides
# the flyout when it loses focus (click-outside dismissal), and window
# active/position plumbing. Same version + license as `slint` (already allowed
# in deny.toml); it is the very backend `slint`'s `backend-winit` feature pulls.
i-slint-backend-winit = "1.17.1"
# Dev-only (duja-ui, feature `smoke`): experimental headless backend for the
# component instantiation smoke test. Optional so the default build never pulls
# it; enabled under `--all-features`. The smoke test itself is `#[ignore]`.
i-slint-backend-testing = "1.17.1"
# Tray icon (duja-app, P4): the tray + menu on the Slint main thread. Version
# pinned to the P1 `spike/eventloop` recipe (tray-icon 0.24.1 + slint 1.17.1).
#
# `default-features = false` drops `libxdo` and `gtk`, which are the Linux
# backend's and which Duja has never been able to use: this dependency is
# declared under `cfg(windows)` and `cfg(target_os = "macos")` only, and P7's
# Linux tray is `ksni` (ADR-0010). They were still reaching the supply-chain gate,
# because `deny.toml`'s `[graph]` has no `targets` key and so evaluates every
# target — which is why eight RUSTSEC ignores for the unmaintained gtk-rs GTK3
# family lived there. Turning the defaults off removes the whole family from
# `Cargo.lock` and the ignores with it.
tray-icon = { version = "0.24.1", default-features = false }
# The Linux tray (duja-app, P7 wave 5; ADR-0010). `tray-icon`'s Linux backend
# wants a GTK event loop and Duja's main thread runs Slint's winit loop, so the
# freedesktop `StatusNotifierItem` is spoken directly instead.
#
# The feature choice is a graph decision, not a taste one. `default-features =
# false` drops ksni's tokio default — tokio is not in this lockfile at all, and
# adding an async runtime to a synchronous app (ADR-0005) to draw a tray icon is
# the wrong trade. `async-io` instead, because every crate that arm names is
# *already* in the Linux graph via the zbus that Slint's winit backend pulls in.
# `blocking` gets ksni's synchronous wrapper so Duja's own code stays
# synchronous; it is not a standalone mode, and ksni's `compat.rs` emits a
# `compile_error!` unless an executor feature is chosen alongside it.
ksni = { version = "0.3.6", default-features = false, features = [
    "async-io",
    "blocking",
] }
# Global hotkeys (duja-app, P5): system-wide accelerators registered on the
# Slint main thread. Version pinned to the P1 `spike/eventloop` recipe
# (global-hotkey 0.8.0 proven cohabiting with slint + tray-icon, zero idle
# wakeups — WM_HOTKEY dispatched by winit's pump).
global-hotkey = "0.8.0"
# Per-user config/state/log directories (duja-app, P4). Resolves the platform
# ProjectDirs for io.github.itabajah.duja.
directories = "6"
# Unix single-instance lock + uid lookup (duja-platform, P6 macOS / P7 Linux):
# rustix's safe wrappers give an advisory `flock` and `getuid` without any
# `unsafe` in the single-instance module. `fs` = flock; `process` = getuid.
#
# `net`, `event` and `pipe` are P7: they are what lets the Linux event pump read
# the kernel's `NETLINK_KOBJECT_UEVENT` socket with **no `unsafe` at all** —
# `net` for the netlink socket and its address type, `event` for the `poll` that
# waits on it, `pipe` for the self-pipe that wakes that poll at shutdown. Doing
# it through `libc` instead would have meant a hand-rolled `sockaddr_nl` and four
# unsafe blocks in a crate that currently has none outside its Windows and macOS
# `sys` modules.
rustix = { version = "1", features = ["fs", "process", "net", "event", "pipe"] }
# Linux display-server clients (duja-dimmer, P7 wave 4). Both are ALREADY normal
# Linux dependencies of the shipping binary through winit — `x11rb` via
# softbuffer, `wayland-client` via smithay-client-toolkit — so declaring them
# directly adds no package to `Cargo.lock`; `x11rb`'s `randr` feature adds
# generated protocol code and no crate. ADR-0011 is the decision they implement,
# and its point is that these are used to *ask* the session what it offers, never
# to identify it.
#
# The `x11rb` requirement is **held at 0.13 on purpose** (ADR-0023, declining
# `#128`). Asking for 0.14 would not upgrade anything: `softbuffer`,
# `x11-clipboard` and `winit` all require `x11rb` on a caret range over 0.13, and
# Duja declares none of them — so 0.14 arrives *beside* 0.13 rather than replacing
# it, which makes the paragraph above false for this line. Worse, it would leave
# one process with two `RustConnection` builds that connect differently: 0.14 drops
# the abstract-unix-socket fallback and `x11-clipboard` would keep it. The lever
# that lifts this is a **Slint** bump carrying that graph onto 0.14, not a
# dependabot ping. `multiple-versions = "warn"`, so cargo-deny will not catch a
# re-introduction on its own; `.github/dependabot.yml` carries the ignore.
x11rb = { version = "0.13", features = ["randr", "xfixes", "shape"] }
wayland-client = "0.31"
# `zxdg_output_manager_v1`, which is the only way to ask a Wayland compositor where
# an output sits in *logical* coordinates. `wl_output` reports the mode in physical
# pixels and an integer scale, which cannot express fractional scaling and so
# cannot be divided back into the desktop rectangle a layer surface actually
# occupies. Same story as the other two: already in `Cargo.lock` through winit, so
# this declares no new package.
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
# `zwlr_layer_shell_v1` (P7 wave 4b): the only protocol on Wayland that lets an
# ordinary client put a surface above every window on a chosen output, which is
# what ADR-0003's overlay *is*. Not in `wayland-protocols` — it is a wlroots
# extension rather than a freedesktop one — but it is in `Cargo.lock` already, via
# `smithay-client-toolkit` under winit and under `smithay-clipboard`, so this
# declares no new package either. `wp_viewporter`, the other half of the overlay,
# is stable and comes from the line above.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Linux D-Bus (duja-panel's logind backlight writer, P7). The version is pinned
# to what `i-slint-backend-winit` already resolves and `async-io` matches its
# executor selection, so the Linux graph gains no second async runtime — see
# ADR-0022, which is the decision this line implements. The feature sets are not
# identical: Slint has no use for `blocking-api` and withholds it.
#
# `blocking-api` is what gates zbus's synchronous wrappers. Do NOT write
# `blocking` here: zbus has a feature of that name too — the implicit feature of
# its optional `blocking` crate dependency, already on via `async-io` — so the
# manifest would resolve cleanly and simply omit `zbus::blocking`, and the
# mistake would surface at the first call site instead. (`ksni`'s feature of the
# same name IS the blocking wrapper. Two crates, one word, two meanings.)
#
# `default-features = false` pins both choices explicitly so a future upstream
# default cannot bring `tokio` in silently.
zbus = { version = "5.17", default-features = false, features = [
    "async-io",
    "blocking-api",
] }
# NOTE: `core-foundation-sys` (declared above in the duja-ddc block) is also the
# macOS event pump's run-loop plumbing (duja-platform's dedicated CFRunLoop
# thread); the CoreGraphics display-reconfiguration and IOKit system-power
# externs are hand-declared in `duja-platform`'s `mac/sys.rs`.
# Structured logging (duja-app, P4): a WARN rotating file log by default,
# DEBUG-to-stderr under `--verbose`.
#
# The feature set is a size decision (P8 wave 1). Two defaults are dropped, two
# are kept, and the difference is whether anything observable changes:
#
# - `env-filter` is DROPPED. It pulls `regex-automata` + `regex-syntax` +
#   `matchers` - 345 KiB of `.text`, and 664,064 bytes of file - to parse a
#   grammar Duja uses none of. `filter::Targets` needs no feature at all (`std`
#   is enough). `bin_support::logging`'s header has the one behaviour difference
#   that survives, and the normalization that removes the other two.
# - `ansi` is DROPPED. It pulls `nu-ansi-term` for colour codes all three call
#   sites already turn off with `.with_ansi(false)`.
# - `tracing-log` is KEPT, and the first version of this comment dropped it with
#   the justification that "that bridge needs a `LogTracer` installed and Duja
#   installs none". That is false: `SubscriberInitExt::try_init` - the call this
#   crate makes - installs one **itself** under that exact feature gate
#   (`tracing-subscriber/src/util.rs`). Dropping it would have silently stopped
#   capturing every `log::` record from `rustls`, `fontdb` and `i-slint-core`,
#   which is a diagnostics regression bought for a few kilobytes.
# - `smallvec` is KEPT. With `env-filter` gone its remaining job is the registry's
#   ancestor buffer in `Scope::from_root`, which is small but is on a logging
#   path; this wave is about bytes, not about making the logger slower. (Not, as
#   this comment first said, "per-span storage" - that is `sharded-slab`.)
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "smallvec",
    "std",
    "tracing-log",
] }
# Build-only (duja-app build.rs, P4): embeds the PerMonitorV2 DPI-awareness
# application manifest into the executable.
embed-manifest = "1"
# Build-only (duja-app build.rs): compiles the one-line `duja.rc` so the static
# whirlpool exe icon (`assets/duja.ico`) is embedded as a PE icon resource. Only
# invoked under the Windows gate; present-but-unused on other lanes.
embed-resource = "3"
# Dev-only (duja-app): the `gen_exe_icon` example encodes the multi-size `.ico`,
# and the drift test decodes it to compare against the whirlpool generator.
ico = "0.5"
# Opt-in update check (duja-app, P5): a single HTTPS GET to the GitHub releases
# API. `default-features = false` + `tls` selects the rustls (ring) backend with
# bundled webpki roots — NO native-tls, so the binary stays self-contained and
# pulls in no OpenSSL/schannel. gzip/json/cookies are intentionally left off.
ureq = { version = "2", default-features = false, features = ["tls"] }

# ---------------------------------------------------------------------------
# Lint wall (ADR: bulletproof-production policy).
# Tests may unwrap: each crate carries
# `#![cfg_attr(test, allow(clippy::unwrap_used, clippy::expect_used, clippy::panic))]`.
# Every `#[allow]` in source requires a `// RATIONALE:` comment (review rubric).
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

# ---------------------------------------------------------------------------
# Release profile. Budget: `duja` <= 16,777,216 bytes, `dujactl` <= 2,097,152,
# enforced by `cargo xtask size` in the release workflow rather than remembered.
# The full measured ledger, and what this profile cost to get there, is the P8
# section of ADR-0012.
# ---------------------------------------------------------------------------
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
# `-Os`: `-O2`'s pipeline with size-aware inlining and vectorization thresholds.
# Measured at -3,277,312 bytes against `opt-level = 3`, which is the single
# largest lever there is here and the only one that reached the budget. It is
# also the only one that is a *trade* rather than a free win, which is why the
# next block exists.
opt-level = "s"
# Keep unwinding: thread supervision relies on catch_unwind (ADR-0005).
panic = "unwind"

# The per-frame path stays at full speed. `-Os` costs real time in a tight
# per-pixel loop, and ADR-0009 chose a *software* renderer - so the crates that
# execute while a frame is being produced are exempted by name:
#
#   i-slint-core                 item-tree traversal and the software renderer's
#                                shared scanline machinery
#   i-slint-renderer-software    the blitter itself
#   swash                        glyph outline loading, scaling and hinting. The
#                                first version of this list omitted it and
#                                credited `zeno` with "glyph rasterization",
#                                which is only the last step:
#                                `fonts/vectorfont.rs` calls
#                                `swash::scale::Render` and hands `zeno` the
#                                filled mask. Text is on the flyout's frame path,
#                                so half the glyph pipeline at `-Os` would have
#                                been an exemption that missed its own target.
#   zeno                         the path/mask rasterizer that call ends in
#   duja-ui                      Slint's generated component code, whose property
#                                getters are read *during* that traversal - it is
#                                on the frame path, not merely near it
#
# This costs 1,429,504 bytes against `-Os` everywhere, and buying it is the point:
# the alternative is guessing about the renderer. What it does NOT prove is that
# a per-package override under fat LTO produces codegen identical to a
# whole-program `-O3` build; rustc writes per-function `optsize` attributes that
# the LTO pipeline honours, and functions from these four carry none, but
# "reaches the linker" is not "identical to -O3". ADR-0012 says so too.
[profile.release.package.i-slint-core]
opt-level = 3
[profile.release.package.i-slint-renderer-software]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
[profile.release.package.zeno]
opt-level = 3
[profile.release.package.duja-ui]
opt-level = 3
