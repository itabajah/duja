# Duja release pipeline — builds, packages, signs, and publishes a tagged release.
#
# Trigger: pushing a `v*` tag publishes a GitHub Release with the Windows
# installer and portable zip, the macOS disk image, the Linux tarball,
# SHA256SUMS, minisign signatures, and a build-provenance attestation.
# `workflow_dispatch` builds the same artifacts and uploads them as workflow
# artifacts for inspection WITHOUT publishing (a dry run) — use it to validate
# the pipeline before tagging.
#
# Every run re-validates the tagged commit (cargo-deny + clippy + tests), so
# advisory/yank drift — or a tag placed on a commit that never passed CI — fails
# the run before anything is PUBLISHED.
#
# Not "before anything is built": those steps live in the `release` job, and the
# `macos` and `linux` jobs below run first with no gate of their own, so the
# Apple slices are built, fused, bundled and codesigned (and notarized+stapled
# when MACOS_SIGN is on), and the Linux tarball is built and staged, before
# `cargo deny` runs. Nothing unverified can reach the Releases page — `release`
# needs both, and every publish step is PUBLISH-gated — but a tag on a bad commit
# wastes those builds -- and, ONCE MACOS_SIGN IS ENABLED (it is unset today, so
# the notarize/staple steps do not run), a notarization submission, which is a
# permanent request to Apple. The gate also runs on windows-latest only, so it
# compiles no cfg(target_os = "macos") or cfg(target_os = "linux") item;
# cargo-deny is the exception, covering the whole graph via deny.toml's
# all-features.
#
# All third-party actions are SHA-pinned (supply-chain policy, as in ci.yml).
# Shell tools installed via choco (Inno Setup, minisign) are outside that policy,
# exactly like the apt-get/choco steps in ci.yml; the choco install is version-
# pinned + checksum-required, and the minisign download is hash-checked.
#
# github.* context (tag name, event) is NEVER interpolated into a run body — it
# flows through a step `env:` map and is read as $env:VAR, so a crafted tag name
# cannot inject shell into this privileged (contents/id-token/attestations:write,
# minisign-secret-holding) job. Full runbook: docs/release-checklist.md.
#
# One-time setup before the first real tag (see SECURITY.md):
#   1. minisign -G -W -p minisign.pub -s minisign.key   (passwordless key)
#   2. add the repo secret MINISIGN_SECRET_KEY = the full contents of minisign.key
#   3. commit minisign.pub and paste its line into SECURITY.md/README
#   4. keep minisign.key offline (never committed)

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

# contents: write → create the Release + upload assets.
# id-token + attestations: write → build-provenance attestation.
permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---- macOS: build both slices, fuse, bundle, image ----------------------
  # Runs FIRST and hands its one artifact to the publishing job below, so the
  # release keeps a single SHA256SUMS, a single minisign pass, and a single
  # GitHub Release — rather than two jobs racing to create the same one.
  #
  # It holds no secrets on the normal path and needs no write scope, so its
  # permissions are narrowed to `contents: read` (a job-level block overrides
  # the workflow-level grant above, which exists for the publishing job).
  #
  # It does NOT re-run the quality gate: that lives in the publishing job, on
  # the same commit, and duplicating cargo-deny/clippy/tests here would double
  # the release's cost to re-answer a question the 3-OS `ci.yml` matrix and that
  # gate already answer. The consequence is deliberate: a mac packaging failure
  # blocks the whole release rather than quietly shipping a Windows-only one.
  macos:
    name: build & package (macos-universal)
    runs-on: macos-latest
    permissions:
      contents: read
    env:
      # BOTH slices are compiled against this floor, so the x86_64 slice's
      # LC_BUILD_VERSION agrees with the `LSMinimumSystemVersion` the bundle
      # advertises instead of silently claiming an older release underneath it.
      # xtask pins the two together: `bundle.rs`'s deployment-target test reads
      # this very line and fails if it drifts from `MIN_MACOS`.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the version — the authoritative "does the tag match?" check belongs
      # to the publishing job, which is the one that can publish a mislabeled
      # artifact. Same first-match-in-Cargo.toml rule as there.
      - name: Resolve version
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$ver" ]; then echo "no version in Cargo.toml" >&2; exit 1; fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "version=$ver"

      # rust-toolchain.toml pins the toolchain; add the slice the runner is not.
      - name: Add both Apple targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Two thin builds — `lipo` cannot fuse what was never compiled. No
      # rust-cache, matching the publishing job: the released build stays
      # hermetic.
      - name: Build release binaries (arm64)
        run: cargo build --release --locked --target aarch64-apple-darwin -p duja-app -p dujactl
      - name: Build release binaries (x86_64)
        run: cargo build --release --locked --target x86_64-apple-darwin -p duja-app -p dujactl

      # ---- Optional: Developer ID signing + notarization — INERT today -----
      # Duja has no Apple Developer account, so the bundle ships with an ad-hoc
      # signature: enough for macOS to *execute* it (Apple Silicon refuses an
      # unsigned binary outright), not enough for Gatekeeper to open a
      # downloaded copy without a trip through System Settings → Privacy &
      # Security → Open Anyway. Same posture as the unsigned Windows installer
      # and its SmartScreen prompt.
      #
      # Enable it with NO edit to this file:
      #   1. Join the Apple Developer Program; create a "Developer ID
      #      Application" certificate and export it as a .p12.
      #   2. Create an App Store Connect API key (Developer ID role).
      #   3. Repo variables: MACOS_SIGN=true, MACOS_SIGN_IDENTITY (the full
      #      certificate common name, e.g. "Developer ID Application: … (TEAM)").
      #   4. Repo secrets: MACOS_CERTIFICATE (base64 of the .p12),
      #      MACOS_CERTIFICATE_PASSWORD, MACOS_NOTARY_KEY (base64 of the .p8),
      #      MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER.
      # The packaging step below already takes the identity as an argument, so
      # turning this on changes no step ordering — exactly like the Azure
      # Trusted Signing block in the publishing job.
      - name: Import Developer ID certificate
        if: vars.MACOS_SIGN == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/duja-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          # Auto-lock after 15 minutes so the key does not outlive the build.
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          cert="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERT_P12" | base64 --decode > "$cert"
          trap 'rm -f "$cert"' EXIT
          security import "$cert" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      # Fuse → bundle → codesign → DMG, all in the dependency-free xtask so the
      # same command produces the same artifact on a maintainer's Mac — provided
      # the two builds above ran with the same MACOSX_DEPLOYMENT_TARGET, which
      # `xtask`'s `Verified::checked` refuses to package without.
      - name: Package Duja.app and the disk image
        env:
          MACOS_SIGN: ${{ vars.MACOS_SIGN }}
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
        run: |
          set -euo pipefail
          if [ "${MACOS_SIGN:-}" = "true" ]; then
            cargo run --release -p xtask -- dist --version "$VERSION" --sign "$MACOS_SIGN_IDENTITY"
          else
            cargo run --release -p xtask -- dist --version "$VERSION"
          fi

      # Checked with Apple's own tools on the bytes this job produces. Note the
      # gated Developer ID path signs and staples the image *after* this step,
      # so on that path the shipped `.dmg` is not the one verified here — the
      # bundle inside it is unchanged, and `stapler` only adds a ticket. The
      # arch/`minos` half duplicates what `xtask`'s `Verified::checked` already
      # refused to sign without. Deliberate, but note what it can and cannot do:
      # a second implementation catches a false *accept*. A false **reject** —
      # the direction a wrong Mach-O constant would fail in — kills the Package
      # step above, so this step never runs to disagree with it.
      #
      # `otool` output goes to a file rather than through a pipe: `awk … exit`
      # closes the read end while `otool` may still be writing, and under
      # `pipefail` a SIGPIPE'd `otool` would fail the release for no reason.
      - name: Verify the bundle
        run: |
          set -euo pipefail
          app="target/dist/duja-$VERSION-macos-universal/Duja.app"
          dmg="target/dist/duja-$VERSION-macos-universal.dmg"
          plist="$app/Contents/Info.plist"
          plutil -lint "$plist"
          plutil -extract LSUIElement raw -o - "$plist" | grep -qx true
          test "$(plutil -extract CFBundleIdentifier raw -o - "$plist")" = "io.github.itabajah.duja"
          for bin in duja dujactl; do
            archs="$(lipo -archs "$app/Contents/MacOS/$bin")"
            echo "$bin: $archs"
            case "$archs" in *arm64*) ;; *) echo "$bin has no arm64 slice" >&2; exit 1;; esac
            case "$archs" in *x86_64*) ;; *) echo "$bin has no x86_64 slice" >&2; exit 1;; esac
            for arch in arm64 x86_64; do
              otool -arch "$arch" -l "$app/Contents/MacOS/$bin" > "$RUNNER_TEMP/otool.txt"
              minos="$(awk '/LC_BUILD_VERSION/{f=1} f && /minos/{v=$2} END{print v}' "$RUNNER_TEMP/otool.txt")"
              echo "$bin/$arch minos=$minos"
              test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"
            done
          done
          codesign --verify --strict --verbose=2 "$app"
          # `hdiutil verify` only checks the image's stored checksum — it never
          # attaches, so an image whose filesystem is unmountable passes it.
          # Mount it and look, which is what a user's first double-click does.
          hdiutil verify "$dmg"
          mount="$RUNNER_TEMP/dmg-check"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -readonly -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force || true' EXIT
          test -x "$mount/Duja.app/Contents/MacOS/duja"
          test -L "$mount/Applications"
          codesign --verify --strict "$mount/Duja.app"
          # A transient busy unmount must not fail a release that passed every
          # other check; the retry is what the EXIT trap would have done anyway.
          hdiutil detach "$mount" || hdiutil detach "$mount" -force
          trap - EXIT

      # Also INERT until MACOS_SIGN is set. Note this step is NOT PUBLISH-gated:
      # notarization is a network round-trip to Apple that can fail for reasons a
      # build cannot predict, and a dry run that skipped it would not be a dry
      # run of the thing most likely to break. The cost is that a notary outage
      # fails the whole release rather than half of it — re-running the workflow
      # on the same tag recovers, because the publishing job `needs:` this one
      # and so never ran: nothing was published, and the re-run creates the
      # Release for the first time. Full note in docs/release-checklist.md.
      # `--timeout` bounds a stuck submission to something well short of the
      # 6-hour job limit. `notarytool` does not document its exit code on
      # timeout, so what actually fails the job may be the `stapler staple`
      # below rather than the submit itself — either way it stops, which is the
      # property that matters.
      - name: Notarize and staple the disk image
        if: vars.MACOS_SIGN == 'true'
        env:
          MACOS_SIGN_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/notary.p8"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$key"
          trap 'rm -f "$key"' EXIT
          dmg="target/dist/duja-$VERSION-macos-universal.dmg"
          # Sign the image itself, not only the app inside it: an unsigned
          # container gets a notarization ticket built from its contents, while a
          # signed one has the ticket cover the image a user actually downloads.
          codesign --force --timestamp --sign "$MACOS_SIGN_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" \
            --key "$key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --timeout 30m
          # Staple the ticket so the image also opens on a machine that is offline.
          xcrun stapler staple "$dmg"

      # The DMG is the only thing the publishing job needs; the staged .app tree
      # is an intermediate, and a zipped .app would need `ditto` to survive the
      # signature — the image already is the distributable container.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duja-macos-universal
          path: target/dist/duja-${{ env.VERSION }}-macos-universal.dmg
          if-no-files-found: error

  # ---- Linux: build, stage, tar ------------------------------------------
  # The macOS job's twin, and a much shorter one: there is nothing to fuse, sign
  # or image. It runs in parallel with that job and hands its one artifact to the
  # publishing job below, on the same terms -- a single SHA256SUMS, a single
  # minisign pass, a single Release.
  #
  # Same narrowed permissions and the same deliberate consequence: a Linux
  # packaging failure blocks the whole release rather than quietly shipping one
  # without it. That is the right direction for an artifact people will be told
  # exists.
  linux:
    name: build & package (linux-x64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same first-match-in-Cargo.toml rule as the macOS job, and the same
      # division of labour: the authoritative "does the tag match?" check belongs
      # to the publishing job, which is the one that can publish a mislabeled
      # artifact.
      - name: Resolve version
        run: |
          set -euo pipefail
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$ver" ]; then echo "no version in Cargo.toml" >&2; exit 1; fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "version=$ver"

      # Slint's Linux backend links these. The list is `ci.yml`'s, and the two
      # have to stay in step: a package missing here fails the release build for
      # a reason the 3-OS matrix already proved is not the code.
      - name: Install Slint system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      # No rust-cache, matching both other jobs: the released build stays
      # hermetic.
      - name: Build release binaries
        run: cargo build --release --locked -p duja-app -p dujactl

      - name: Package the tarball
        run: cargo run --release -p xtask -- dist --version "$VERSION"

      # Checked on the bytes this job produced, by extracting the archive the way
      # a user will rather than inspecting the staging tree beside it. The two are
      # not the same claim: `tar` is what turns a correct tree into a correct
      # archive, and the permission bit is exactly what it can lose.
      - name: Verify the tarball
        run: |
          set -euo pipefail
          stage="duja-$VERSION-linux-x64"
          tarball="target/dist/$stage.tar.gz"
          check="$RUNNER_TEMP/tar-check"
          mkdir -p "$check"
          tar xzf "$tarball" -C "$check"
          # One directory at the root, named for the release -- which is what
          # every install command in packaging/linux/README.md assumes.
          test -d "$check/$stage"
          test "$(ls "$check")" = "$stage"
          for bin in duja dujactl; do
            test -x "$check/$stage/$bin"
          done
          for f in LICENSE-MIT LICENSE-APACHE README.md duja.desktop duja.png; do
            test -s "$check/$stage/$f"
          done
          # The entry has to be a valid one, not merely present.
          # `desktop-file-validate` is the freedesktop reference checker.
          sudo apt-get install -y --no-install-recommends desktop-file-utils
          desktop-file-validate "$check/$stage/duja.desktop"
          # It runs, and it is the build this tag names. Not much of a smoke test
          # on a headless runner -- there is no display server, so this is the CLI
          # half -- but it is the difference between shipping a binary and
          # shipping a file, and comparing the version closes the other half of
          # the mislabelling gap: `bundle`'s tests pin the artifact's *name* to
          # the version, and this pins the *binary inside it* to the same one. A
          # stale `target/release` would otherwise be packaged under a fresh name
          # and pass every other check here.
          #
          # `version`, a subcommand -- `dujactl` has no `--version` flag, and
          # asking for one prints usage and exits 2. That is how this step failed
          # the first time it ever ran, which is what the dry run is for.
          got="$("$check/$stage/dujactl" version)"
          echo "dujactl version: $got"
          test "$got" = "dujactl $VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duja-linux-x64
          path: target/dist/duja-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: build & publish (windows-x64)
    runs-on: windows-latest
    # The macOS image and the Linux tarball are folded into this job's
    # SHA256SUMS, minisign pass, provenance attestation and Release, so both have
    # to exist first. They build in parallel with each other; only this job waits.
    needs: [macos, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff needs full history + tags to render the release notes.
          fetch-depth: 0

      # Resolve the version and decide whether this run publishes. On a tag push
      # the tag (minus `v`) MUST equal the workspace version, or we fail fast
      # rather than ship a mislabeled installer.
      - name: Resolve version
        shell: pwsh
        env:
          # Pass github context through env — never splice ${{ github.* }} into a
          # run body (a crafted tag name would otherwise inject PowerShell here).
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+?)"' |
                  Select-Object -First 1).Matches.Groups[1].Value
          # Publish ONLY on a tag *push* — never on workflow_dispatch, even if it
          # was manually pointed at a tag ref (that path is a dry run by design).
          if ($env:EVENT_NAME -eq 'push' -and $env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME -replace '^v',''
            if ($tag -ne $ver) { throw "tag $tag does not match Cargo.toml version $ver" }
            $publish = 'true'
          } else {
            $publish = 'false'
          }
          "VERSION=$ver" >> $env:GITHUB_ENV
          "PUBLISH=$publish" >> $env:GITHUB_ENV
          Write-Host "version=$ver publish=$publish"

      # ---- Release gate: re-validate the tagged commit ----------------------
      # The 3-OS matrix already ran on the merge PR; re-run the quality gate here
      # on the exact tagged commit to catch advisory/yank drift since the merge
      # and to refuse a tag placed on a commit that never passed CI. Runs on BOTH
      # the publish (tag push) and dry-run (workflow_dispatch) paths and fails the
      # job on any error, so a red or advisory-drifted tag can never publish.
      # No rust-cache below this point: the signed build stays hermetic (a clean
      # build is the trade for reproducibility). ci.yml keeps its cache.
      - uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: cargo-deny,cargo-nextest
      - name: Gate (cargo-deny)
        run: cargo deny check
      - name: Gate (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Gate (tests)
        run: cargo nextest run --workspace --all-features
      - name: Gate (doctests)
        run: cargo test --doc --workspace --all-features

      # rust-toolchain.toml pins 1.96.1; rustup installs it on first use.
      - name: Build release binaries
        run: cargo build --release --locked -p duja-app -p dujactl

      # ADR-0012's budget, enforced on the bytes this job just produced rather
      # than remembered. The binary went from 14.9 MB at P4 to 19.4 MB by P7 with
      # nothing in the path to notice, and it was a human reading a ledger months
      # later that caught it.
      #
      # This runs BEFORE packaging on purpose: an over-budget binary should fail
      # here, not after it has been zipped, installed into an Inno Setup tree,
      # checksummed and signed. It is also deliberately not a PR check - the
      # measurement needs a fat-LTO release build, which is roughly twenty
      # minutes on a hosted Windows runner. `docs/debt.md` carries the gap that
      # leaves: a dependency bump that adds a megabyte is caught here, at the
      # next release, rather than at the pull request that lands it.
      - name: Gate (binary size budget)
        run: cargo run --release -p xtask -- size

      # Portable zip (staging + Compress-Archive), via the dependency-free xtask.
      - name: Stage portable archive
        shell: pwsh
        run: cargo run --release -p xtask -- dist --version $env:VERSION

      # Inno Setup installer. Not reliably preinstalled on windows-latest → install.
      - name: Install Inno Setup
        # Pin the exact version and require a verified checksum so a bumped or
        # compromised upstream package can't slip into the signed build. 6.7.1 is
        # the current stable Inno Setup 6 on Chocolatey (no 6.4.x is published there).
        run: choco install innosetup --version=6.7.1 -y --no-progress --require-checksums
      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=$env:VERSION" packaging\windows\duja.iss

      # The macOS disk image the `macos` job built, dropped beside the Windows
      # artifacts so it is covered by the same SHA256SUMS, the same minisign
      # pass, the same provenance attestation and the same Release. Naming the
      # artifact extracts its contents straight into `path`, so the .dmg lands
      # in target/dist rather than in a subdirectory.
      - name: Fetch the macOS disk image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: duja-macos-universal
          path: target/dist

      - name: Fetch the Linux tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: duja-linux-x64
          path: target/dist

      # ---- Optional: Azure Trusted Signing (Authenticode) — INERT today -----
      # Duja ships no code-signing certificate yet, so this step is guarded off.
      # When a cert exists, Authenticode-signing the installer stops SmartScreen
      # warning on first run. It runs BEFORE Compute SHA256SUMS on purpose, so the
      # checksums AND the provenance attestation cover the *signed* bytes —
      # enabling it is a config-only change, no step reordering.
      #
      # Enable it with NO edit to this file:
      #   1. Create an Azure Trusted Signing account + certificate profile.
      #   2. Repo variables: AZURE_SIGN=true, AZURE_SIGN_ENDPOINT,
      #      AZURE_SIGN_ACCOUNT, AZURE_SIGN_CERT_PROFILE.
      #   3. Repo secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET
      #      (or wire OIDC via this job's existing `id-token: write` and drop the
      #      client secret — the more secure option).
      # Only the installer .exe is Authenticode-signable; the portable .zip, the
      # macOS .dmg and the Linux .tar.gz are not PE files. They stay covered by
      # minisign and
      # provenance; SHA256SUMS is covered by minisign ONLY -- subject-path lists
      # the three binaries and deliberately excludes it.
      - name: Sign installer (Azure Trusted Signing)
        if: env.PUBLISH == 'true' && vars.AZURE_SIGN == 'true'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGN_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGN_CERT_PROFILE }}
          files: ${{ github.workspace }}/target/dist/duja-setup-${{ env.VERSION }}.exe

      # SHA256SUMS over every shippable artifact (two-space `sha256sum -c` form).
      - name: Compute SHA256SUMS
        shell: pwsh
        run: |
          Push-Location target/dist
          $files = "duja-setup-${env:VERSION}.exe",
                   "duja-${env:VERSION}-windows-x64.zip",
                   "duja-${env:VERSION}-macos-universal.dmg",
                   "duja-${env:VERSION}-linux-x64.tar.gz"
          # Write LF-only and no BOM: Set-Content -Encoding ascii emits CRLF, which
          # leaves a trailing \r on every filename so Linux `sha256sum -c SHA256SUMS`
          # fails even though the hashes are correct. Keep the two-space form.
          $lines = Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) }
          $content = ($lines -join "`n") + "`n"
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'SHA256SUMS'), $content)
          Get-Content SHA256SUMS
          Pop-Location

      # Dry-run visibility: always upload the built artifacts for inspection.
      # Every file SHA256SUMS lists is in here, so a dry run can be verified as
      # a set rather than leaving the checksum file naming an absent artifact.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: duja-${{ env.VERSION }}-release
          path: |
            target/dist/duja-setup-${{ env.VERSION }}.exe
            target/dist/duja-${{ env.VERSION }}-windows-x64.zip
            target/dist/duja-${{ env.VERSION }}-macos-universal.dmg
            target/dist/duja-${{ env.VERSION }}-linux-x64.tar.gz
            target/dist/SHA256SUMS
          if-no-files-found: error

      # ---- Publish-only steps (tag pushes) ----------------------------------

      # Sign every artifact (installer, zip, disk image, SHA256SUMS) with the
      # offline key. The .dmg is signed here like any other file: minisign is
      # the authenticity story a user can check without an Apple ID, and it is
      # independent of whatever code signature the bundle inside carries.
      - name: Sign artifacts (minisign)
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MINISIGN_KEY)) {
            throw "MINISIGN_SECRET_KEY secret is not set — see SECURITY.md"
          }
          # Use the official minisign 0.12 (pinned + hash-checked). Chocolatey's
          # minisign is 0.8.0, which cannot read a passwordless key generated by
          # a modern minisign ("Unsupported key derivation function").
          $zip = "$env:RUNNER_TEMP\minisign.zip"
          $url = "https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-win64.zip"
          $sha = "37b600344e20c19314b2e82813db2bfdcc408b77b876f7727889dbd46d539479"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) { throw "minisign zip hash mismatch: $got" }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\minisign" -Force
          $minisign = "$env:RUNNER_TEMP\minisign\minisign-win64\x86_64\minisign.exe"
          # Write the secret key to an ABSOLUTE path under RUNNER_TEMP so the
          # finally wipes it even if signing throws while CWD is inside target/dist
          # (Push-Location below moves us there before the signing loop).
          $keyPath = Join-Path $env:RUNNER_TEMP 'minisign.key'
          $env:MINISIGN_KEY | Set-Content -NoNewline -Encoding ascii -LiteralPath $keyPath
          try {
            Push-Location target/dist
            foreach ($f in "duja-setup-${env:VERSION}.exe",
                            "duja-${env:VERSION}-windows-x64.zip",
                            "duja-${env:VERSION}-macos-universal.dmg",
                            "duja-${env:VERSION}-linux-x64.tar.gz",
                            "SHA256SUMS") {
              & $minisign -S -s $keyPath -m $f -c "duja ${env:VERSION}"
              if ($LASTEXITCODE -ne 0) { throw "minisign failed for $f" }
            }
            Pop-Location
          } finally {
            # Absolute path → wiped regardless of the CWD when the block unwinds.
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            target/dist/duja-setup-${{ env.VERSION }}.exe
            target/dist/duja-${{ env.VERSION }}-windows-x64.zip
            target/dist/duja-${{ env.VERSION }}-macos-universal.dmg
            target/dist/duja-${{ env.VERSION }}-linux-x64.tar.gz

      - name: Install git-cliff
        if: env.PUBLISH == 'true'
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2
        with:
          tool: git-cliff
      - name: Generate release notes
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          # Same rule as Resolve version: the tag reaches git-cliff via env and is
          # passed as a single quoted argument, never spliced into the run body.
          REF_NAME: ${{ github.ref_name }}
        run: git cliff --tag "$env:REF_NAME" --latest --strip all -o RELEASE_NOTES.md

      - name: Create GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            target/dist/duja-setup-${{ env.VERSION }}.exe
            target/dist/duja-${{ env.VERSION }}-windows-x64.zip
            target/dist/duja-${{ env.VERSION }}-macos-universal.dmg
            target/dist/duja-${{ env.VERSION }}-linux-x64.tar.gz
            target/dist/SHA256SUMS
            target/dist/*.minisig
