[package]
name = "duja-app"
description = "Duja — the lightweight monitor brightness controller (tray application)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "duja"
path = "src/main.rs"

[dependencies]
duja-core.workspace = true
duja-ddc.workspace = true
duja-panel.workspace = true
duja-platform.workspace = true
duja-ipc.workspace = true
duja-dimmer.workspace = true
duja-ui.workspace = true
crossbeam-channel.workspace = true
anyhow.workspace = true
thiserror.workspace = true
directories.workspace = true
# Opt-in update check (P5): one HTTPS GET + a tiny JSON parse of `tag_name`.
ureq.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The tray app drives the Slint event loop directly (run_event_loop_until_quit,
# invoke_from_event_loop). Same version/features as duja-ui so one Slint backend
# is shared across the process.
slint.workspace = true

# The tray icon and global hotkeys are the two crates the tray assembly needs on
# every platform it runs on. Same pinned versions on both, from the P1
# `spike/eventloop` recipe — they cohabit with Slint on one main thread, which is
# the property the whole tray design rests on.
[target.'cfg(windows)'.dependencies]
tray-icon.workspace = true
global-hotkey.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # SetCurrentProcessExplicitAppUserModelID, the toast's app identity. This used
    # to be the *secondary* reason for this feature, behind ShellExecuteW for
    # opening the releases page; that call moved to `duja_platform::desktop` with
    # the macOS assembly, so the toast is now the only reason left.
    "Win32_UI_Shell",
    # WinRT toast notification for a newly-available update (no extra crate).
    "UI_Notifications",
    "Data_Xml_Dom",
    "Foundation",
    "Foundation_Collections",
] }

# Linux takes neither of the two crates above (ADR-0010). `tray-icon`'s Linux
# backend needs a GTK loop; `global-hotkey`'s Linux arm is X11-only, and this
# wave has to work on a Wayland session as well, so Duja registers no global
# hotkeys on Linux and says so in the settings window rather than showing
# bindings that silently do nothing.
[target.'cfg(target_os = "linux")'.dependencies]
ksni.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon.workspace = true
global-hotkey.workspace = true
# The status item needs exactly one thing `tray-icon` does not expose: the
# activation policy (`.accessory`, so Duja has no Dock tile and no menu bar of its
# own), which is an `NSApplication` call on the main thread. Same objc2 pins the
# other crates use, so nothing new enters Cargo.lock.
#
# Minimal, and measured rather than assumed: `NSStatusBar` and `NSResponder` were
# declared here first with a justification about reading the menu bar's thickness
# for the icon size. No such read exists — `tray/icon.rs` uses a documented
# constant and says why — and stripping both still compiles for
# aarch64-apple-darwin.
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
    "std",
    # NSApplication: sharedApplication + setActivationPolicy.
    "NSApplication",
] }

[build-dependencies]
embed-manifest.workspace = true
# Embeds the whirlpool exe icon (Windows only; the build.rs call is gated).
embed-resource.workspace = true

[dev-dependencies]
# The headless Slint backend, so `bin_support::tray`'s fixture can build both
# shells without a display (`duja-ui` proves the pattern in its own suite). A
# dev-dependency rather than an optional feature: these tests should run under a
# bare `cargo test`, not only under CI's `--all-features`.
i-slint-backend-testing.workspace = true
duja-core = { workspace = true, features = ["test-support"] }
duja-dimmer = { workspace = true }
duja-platform = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
# The `gen_exe_icon` example encoder + the icon drift-guard test (duja-ui, which
# owns `whirlpool_rgba`, is already a normal dependency).
ico.workspace = true

[lints]
workspace = true
