# git-cliff configuration.
#
# DO NOT regenerate CHANGELOG.md wholesale. This comment used to say the file
# "is regenerated at every tag", and following that at v0.1.6 deleted 174 lines.
# Every section from [0.1.1] onward carries a hand-written intro paragraph and
# prose bullets that git-cliff cannot reproduce, because they are in no commit
# subject: [0.1.5] went 43 lines -> 11, [0.1.1] 69 -> 15. ([0.1.0] is the one
# exception - it has no hand-written prose, and regeneration slightly EXPANDS
# it, which is why "every section" was too strong a claim.) Nothing in CI
# regenerates this file either, so the instruction also described automation
# that does not exist.
#
# The release step is to PREPEND one section and leave the rest alone:
#
#   git cliff --tag vX.Y.Z --unreleased --strip header -o section.md
#   # then insert that above the previous release's heading, and write the
#   # intro paragraph by hand - see docs/release-checklist.md.
#
# The `body` template below is therefore used for one section at a time, and
# `header` is CHANGELOG.md's own header, which is why it is not the release-notes
# preamble (ADR-0024 explains that split).

[changelog]
header = """
# Changelog

All notable changes to Duja are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com), generated by
[git-cliff](https://git-cliff.org) from conventional commits.

"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^(chore|ci|build)", skip = true },
  { message = "^revert", group = "Reverted" },
]
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
